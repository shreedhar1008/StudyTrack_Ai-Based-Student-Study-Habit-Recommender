<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Journey - StudyTrack AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .summary-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(79, 70, 229, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .summary-info h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-info p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .performance-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            font-weight: 600;
        }

        .tab.active {
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        .habits-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .category-column h3 {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--glass-border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
            padding-left: 1.5rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.35rem;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 4px solid var(--background);
            box-shadow: 0 0 10px var(--primary);
        }

        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .timeline-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">
                <span style="font-size: 2rem;">🎓</span>
                <h2 class="gradient-text" style="display: inline; margin-left: 0.5rem;">StudyTrack</h2>
            </div>
            <nav class="nav-links">
                <a href="/student" class="nav-item"><span>🤖</span> AI Coach</a>
                <a href="/student/progress" class="nav-item active"><span>📊</span> Performance History</a>
            </nav>
            <div class="user-profile"
                style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 1.5rem; display: flex; align-items: center; gap: 1rem;">
                <div class="avatar" id="userAvatar"
                    style="width: 42px; height: 42px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    S</div>
                <div class="user-info">
                    <h4 style="margin: 0; font-size: 0.9rem;" id="userName">Student</h4>
                    <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted);">Academic Track</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header style="margin-bottom: 2.5rem;">
                <h1 class="gradient-text">Performance Journey</h1>
                <p style="color: var(--text-muted);">Track your evolution and academic growth over time.</p>
            </header>

            <div class="summary-bar">
                <div class="summary-card">
                    <div class="summary-icon">📖</div>
                    <div class="summary-info">
                        <h4>Avg. Study</h4>
                        <p id="avgStudy">0.0h</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">😴</div>
                    <div class="summary-info">
                        <h4>Sleep Quality</h4>
                        <p id="avgSleep">0.0h</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">🎯</div>
                    <div class="summary-info">
                        <h4>Latest Risk</h4>
                        <p id="latestRisk">Low</p>
                    </div>
                </div>
            </div>

            <div class="performance-tabs">
                <button class="tab active" onclick="showTab('log')">Record Activity</button>
                <button class="tab" onclick="showTab('history')">Performance Timeline</button>
            </div>

            <div id="logTab" class="tab-content active">
                <div class="glass-card">
                    <form id="habitForm">
                        <div class="habits-category-grid">
                            <div class="category-column">
                                <h3>🚀 Daily Productivity</h3>
                                <div class="form-group">
                                    <label class="form-label">Study Hours</label>
                                    <input type="number" id="studyHours" class="form-control" step="0.1" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Attendance (%)</label>
                                    <input type="number" id="attendance" class="form-control" min="0" max="100"
                                        required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Exercise Frequency</label>
                                    <input type="number" id="exercise" class="form-control" min="0" max="7" required>
                                </div>
                            </div>
                            <div class="category-column">
                                <h3>🧠 Mental Wellbeing</h3>
                                <div class="form-group">
                                    <label class="form-label">Sleep Hours</label>
                                    <input type="number" id="sleepHours" class="form-control" step="0.1" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Stress Level (1-10)</label>
                                    <input type="range" id="stress" min="1" max="10" value="5" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Mental Health (1-10)</label>
                                    <input type="range" id="mentalHealth" min="1" max="10" value="8"
                                        class="form-control">
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="socialMedia" value="2">
                        <input type="hidden" id="motivation" value="7">
                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.25rem;">Sync
                            Today's Data 🚀</button>
                    </form>
                </div>
            </div>

            <div id="historyTab" class="tab-content" style="display: none;">
                <div id="timelineContainer" class="timeline">
                    <!-- Populated by JS -->
                    <div class="glass-card" style="text-align: center; color: var(--text-muted);">
                        Loading your academic evolution...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            if (tabName === 'log') {
                document.getElementById('logTab').style.display = 'block';
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('historyTab').style.display = 'block';
                document.querySelectorAll('.tab')[1].classList.add('active');
                loadHistory();
            }
        }

        async function loadHistory() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const studentId = user.student_id;
            if (!studentId) return;

            try {
                const res = await fetch(`/api/student/recommendation-history/${studentId}`);
                const data = await res.json();

                if (data.status === 'success') {
                    renderTimeline(data.history);
                    updateSummary(data.history);
                }
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        function renderTimeline(history) {
            const container = document.getElementById('timelineContainer');
            if (!history || history.length === 0) {
                container.innerHTML = '<div class="glass-card" style="text-align: center;">No history logs found yet.</div>';
                return;
            }

            container.innerHTML = history.reverse().map(item => `
                <div class="timeline-item">
                    <div class="timeline-card">
                        <div class="timeline-header">
                            <span class="timeline-date">🗓️ ${new Date(item.date).toLocaleDateString()}</span>
                            <span class="badge ${item.risk_level === 'High' ? 'badge-danger' : 'badge-success'}">${item.risk_level} Risk</span>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem;">
                            <div class="glass" style="padding: 0.5rem; border-radius: 8px; font-size: 0.8rem; text-align: center;">
                                📖 ${item.habits.study_hours}h
                            </div>
                            <div class="glass" style="padding: 0.5rem; border-radius: 8px; font-size: 0.8rem; text-align: center;">
                                😴 ${item.habits.sleep_hours}h
                            </div>
                            <div class="glass" style="padding: 0.5rem; border-radius: 8px; font-size: 0.8rem; text-align: center;">
                                🔥 ${item.habits.stress_level}/10
                            </div>
                        </div>
                        
                        ${item.recommendations && item.recommendations.length > 0 ? `
                            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                                <h5 style="color: var(--accent); margin-bottom: 0.75rem; font-size: 0.9rem;">💡 Recommendations</h5>
                                <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                                    ${item.recommendations.map(rec => `
                                        <li style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 0.5rem;">
                                            <span>•</span>
                                            <span><strong>${rec.category}:</strong> ${rec.message}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateSummary(history) {
            if (!history || history.length === 0) return;
            const avgStudy = (history.reduce((a, b) => a + b.habits.study_hours, 0) / history.length).toFixed(1);
            const avgSleep = (history.reduce((a, b) => a + b.habits.sleep_hours, 0) / history.length).toFixed(1);
            const latestRisk = history[0].risk_level;

            document.getElementById('avgStudy').textContent = avgStudy + 'h';
            document.getElementById('avgSleep').textContent = avgSleep + 'h';
            document.getElementById('latestRisk').textContent = latestRisk;
        }

        document.getElementById('habitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const data = {
                student_id: user.student_id,
                study_hours: parseFloat(document.getElementById('studyHours').value),
                sleep_hours: parseFloat(document.getElementById('sleepHours').value),
                attendance_percentage: parseFloat(document.getElementById('attendance').value),
                social_media_hours: parseFloat(document.getElementById('socialMedia').value),
                exercise_frequency: parseInt(document.getElementById('exercise').value),
                stress_level: parseInt(document.getElementById('stress').value),
                mental_health_rating: parseInt(document.getElementById('mentalHealth').value),
                motivation_level: parseInt(document.getElementById('motivation').value),
                time_management_score: 7, financial_stress: 0, screen_time_hours: 3, previous_gpa: 3.0,
                exam_score: 75, assignment_completion_rate: 90
            };

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert('Habits recorded successfully!');
                    loadHistory();
                    showTab('history');
                }
            } catch (e) {
                alert('Submission failed!');
            }
        });

        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.student_id) window.location.href = '/login';
            document.getElementById('userName').textContent = user.fullname || user.username || 'Student';
            document.getElementById('userAvatar').textContent = (user.fullname || user.username || 'S')[0].toUpperCase();
            loadHistory();
        };
    </script>
</body>

</html>
