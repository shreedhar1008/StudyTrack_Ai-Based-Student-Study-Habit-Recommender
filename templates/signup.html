<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StudyTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.8s ease-out;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            backdrop-filter: blur(8px);
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>
    <div class="signup-card glass-card">
        <div class="signup-header">
            <a href="/" style="text-decoration: none; display: inline-block; margin-bottom: 1rem;">
                <span style="font-size: 2.5rem;">🎓</span>
            </a>
            <h1 class="gradient-text" style="font-size: 2.25rem;">Create Account</h1>
            <p style="color: var(--text-muted);">Join the future of student success</p>
        </div>

        <div id="message" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input class="form-control" type="text" id="fullName" name="fullName" required
                    placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" required
                    placeholder="Choose a username">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" name="email" required
                    placeholder="your.email@example.com">
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required
                        placeholder="Password">
                </div>
                <div>
                    <label class="form-label" for="confirmPassword">Confirm</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required
                        placeholder="Confirm">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-signup" style="width: 100%; margin-top: 1rem;">
                Start Your Journey
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.95rem;">
            Already have an account?
            <a href="/login" style="color: var(--accent); text-decoration: none; font-weight: 600;">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long!', 'error');
                return;
            }

            const btn = document.querySelector('.btn-signup');
            btn.textContent = 'Creating Account...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Account created successfully! Redirecting...', 'success');

                    // Store user info in localStorage
                    localStorage.setItem('user', JSON.stringify({
                        user_id: data.user_id,
                        student_id: data.student_id,
                        username: data.username,
                        role: data.role
                    }));

                    // Redirect to student dashboard
                    setTimeout(() => {
                        window.location.href = '/student';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    btn.textContent = 'Create Account';
                    btn.disabled = false;
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again.', 'error');
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + type;
            msgDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    msgDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>

</html>
