<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-navbutton-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <title>Performance Journey - StudyTrack AI</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <script>
        (function() {
            try {
                var u = JSON.parse(localStorage.getItem('user') || '{}');
                if (!u.student_id && !u.user_id) {
                    window.location.replace('/login');
                }
            } catch(e) {
                window.location.replace('/login');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .summary-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 14px;
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .summary-info h4 {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .summary-info p {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--text);
            margin-top: 0.1rem;
        }

        .performance-tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .tab {
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .tab.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .habits-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .category-column h3 {
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
            padding-left: 1rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.35rem;
            top: 1.25rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .timeline-date {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .timeline-metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        @media (max-width: 800px) {
            .summary-bar {
                grid-template-columns: 1fr;
            }
            .habits-category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Mobile Top Navigation Bar -->
    <header class="mobile-topbar">
        <div style="display: flex; align-items: center; gap: 0.6rem;">
            <button class="menu-toggle-btn" id="menuToggleBtn" onclick="toggleSidebar()" aria-label="Open menu">
                <span>☰</span>
            </button>
            <a href="/" class="logo" style="display: flex; align-items: center;">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="StudyTrack AI" style="height: 28px; width: auto; max-width: 140px; object-fit: contain;">
            </a>
        </div>
        <div style="display: flex; align-items: center; gap: 0.6rem;">
            <div class="avatar" id="mobileUserAvatar" style="width: 36px; height: 36px; font-size: 0.9rem;">
                S
            </div>
            <button onclick="logout()" style="background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1.25rem; padding: 4px;" aria-label="Logout">
                🚪
            </button>
        </div>
    </header>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="dashboard-layout">
        <!-- Sidebar Panel -->
        <aside class="sidebar-panel" id="sidebarPanel">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div class="logo" style="display: flex; align-items: center;">
                    <a href="/" style="text-decoration: none; display: flex; align-items: center;">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="StudyTrack AI" style="height: 36px; width: auto; max-width: 175px; object-fit: contain;">
                    </a>
                </div>
                <button class="menu-toggle-btn" onclick="toggleSidebar()" style="display: none;" id="sidebarCloseBtn" aria-label="Close menu">
                    ✕
                </button>
            </div>

            <nav class="nav-links">
                <a href="/student" class="nav-item"><span>🤖</span> AI Coach</a>
                <a href="/student/progress" class="nav-item active"><span>📊</span> Performance History</a>
            </nav>

            <div class="user-profile">
                <div class="avatar" id="userAvatar">S</div>
                <div class="user-info" style="overflow: hidden; flex: 1;">
                    <h4 style="margin: 0; font-size: 0.95rem; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" id="userName">Student</h4>
                    <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted);">Academic Track</p>
                </div>
                <button onclick="logout()"
                    style="background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1.25rem; padding: 4px;"
                    title="Logout">
                    🚪
                </button>
            </div>
        </aside>

        <!-- Main Viewport -->
        <main class="main-viewport">
            <header style="margin-bottom: 2rem;">
                <h1 class="gradient-text" style="font-size: 2rem; margin-bottom: 0.35rem;">Performance Journey</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Track your evolution and academic growth over time.</p>
            </header>

            <!-- 3 Summary KPI Cards (Exact original) -->
            <div class="summary-bar">
                <div class="summary-card">
                    <div class="summary-icon">📖</div>
                    <div class="summary-info">
                        <h4>Avg. Study</h4>
                        <p id="avgStudy">0.0h</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">😴</div>
                    <div class="summary-info">
                        <h4>Sleep Quality</h4>
                        <p id="avgSleep">0.0h</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">🎯</div>
                    <div class="summary-info">
                        <h4>Latest Risk</h4>
                        <p id="latestRisk">Low</p>
                    </div>
                </div>
            </div>

            <div class="performance-tabs">
                <button class="tab active" onclick="showTab('log')">Record Activity</button>
                <button class="tab" onclick="showTab('history')">Performance Timeline</button>
            </div>

            <!-- Tab 1: Record Activity (Exact original inputs) -->
            <div id="logTab" class="tab-content active" style="display: block;">
                <div class="glass-card">
                    <form id="habitForm">
                        <div class="habits-category-grid">
                            <div class="category-column">
                                <h3>🚀 Daily Productivity</h3>
                                <div class="form-group">
                                    <label class="form-label" for="studyHours">Study Hours</label>
                                    <input type="number" id="studyHours" class="form-control" step="0.1" min="0" max="24" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="attendance">Attendance (%)</label>
                                    <input type="number" id="attendance" class="form-control" min="0" max="100" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="exercise">Exercise Frequency (Days/Wk)</label>
                                    <input type="number" id="exercise" class="form-control" min="0" max="7" required>
                                </div>
                            </div>
                            <div class="category-column">
                                <h3>🧠 Mental Wellbeing</h3>
                                <div class="form-group">
                                    <label class="form-label" for="sleepHours">Sleep Hours</label>
                                    <input type="number" id="sleepHours" class="form-control" step="0.1" min="0" max="24" required>
                                </div>
                                <div class="form-group">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                                        <label class="form-label" for="stress" style="margin: 0;">Stress Level</label>
                                        <span id="stressVal" style="color: var(--primary); font-weight: 700; font-size: 0.85rem;">5/10</span>
                                    </div>
                                    <input type="range" id="stress" min="1" max="10" value="5" oninput="document.getElementById('stressVal').textContent = this.value + '/10'">
                                </div>
                                <div class="form-group">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                                        <label class="form-label" for="mentalHealth" style="margin: 0;">Mental Health</label>
                                        <span id="mentalHealthVal" style="color: var(--primary); font-weight: 700; font-size: 0.85rem;">8/10</span>
                                    </div>
                                    <input type="range" id="mentalHealth" min="1" max="10" value="8" oninput="document.getElementById('mentalHealthVal').textContent = this.value + '/10'">
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="socialMedia" value="2">
                        <input type="hidden" id="motivation" value="7">
                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.95rem; font-size: 1.05rem;">
                            Sync Today's Data 🚀
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tab 2: Performance Timeline (Exact original timeline) -->
            <div id="historyTab" class="tab-content" style="display: none;">
                <div id="timelineContainer" class="timeline">
                    <div class="glass-card" style="text-align: center; color: var(--text-muted);">
                        Loading your academic evolution...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarPanel');
            const overlay = document.getElementById('sidebarOverlay');
            const closeBtn = document.getElementById('sidebarCloseBtn');

            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');

            if (sidebar.classList.contains('open')) {
                closeBtn.style.display = 'inline-flex';
            } else {
                closeBtn.style.display = 'none';
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            if (tabName === 'log') {
                document.getElementById('logTab').style.display = 'block';
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('historyTab').style.display = 'block';
                document.querySelectorAll('.tab')[1].classList.add('active');
                loadHistory();
            }
        }

        async function loadHistory() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const studentId = user.student_id;
            if (!studentId) return;

            try {
                const res = await fetch(`/api/student/recommendation-history/${studentId}`);
                const data = await res.json();

                if (data.status === 'success') {
                    renderTimeline(data.history);
                    updateSummary(data.history);
                }
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        function renderTimeline(history) {
            const container = document.getElementById('timelineContainer');
            if (!history || history.length === 0) {
                container.innerHTML = '<div class="glass-card" style="text-align: center; color: var(--text-muted);">No history logs found yet. Record your daily activity to see trends here!</div>';
                return;
            }

            container.innerHTML = history.slice().reverse().map(item => `
                <div class="timeline-item">
                    <div class="timeline-card">
                        <div class="timeline-header">
                            <span class="timeline-date">🗓️ ${new Date(item.date).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            <span class="badge ${item.risk_level === 'High' ? 'badge-danger' : (item.risk_level === 'Moderate' ? 'badge-warning' : 'badge-success')}">${item.risk_level} Risk</span>
                        </div>
                        <div class="timeline-metrics-grid">
                            <div class="glass" style="padding: 0.6rem; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight:600;">
                                📖 ${item.habits ? item.habits.study_hours : 0}h Study
                            </div>
                            <div class="glass" style="padding: 0.6rem; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight:600;">
                                😴 ${item.habits ? item.habits.sleep_hours : 0}h Sleep
                            </div>
                            <div class="glass" style="padding: 0.6rem; border-radius: 8px; font-size: 0.85rem; text-align: center; font-weight:600;">
                                🔥 ${item.habits ? item.habits.stress_level : 0}/10 Stress
                            </div>
                        </div>
                        
                        ${item.recommendations && item.recommendations.length > 0 ? `
                            <div style="margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                                <h5 style="color: var(--primary); margin-bottom: 0.4rem; font-size: 0.88rem; font-weight:700;">💡 Recommendations</h5>
                                <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.35rem;">
                                    ${item.recommendations.map(rec => `
                                        <li style="font-size: 0.85rem; color: var(--text-secondary); display: flex; gap: 0.5rem;">
                                            <span style="color: var(--primary);">•</span>
                                            <span><strong>${rec.category}:</strong> ${rec.message}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateSummary(history) {
            if (!history || history.length === 0) return;
            const avgStudy = (history.reduce((a, b) => a + (b.habits ? b.habits.study_hours : 0), 0) / history.length).toFixed(1);
            const avgSleep = (history.reduce((a, b) => a + (b.habits ? b.habits.sleep_hours : 0), 0) / history.length).toFixed(1);
            const latestRisk = history[0].risk_level || 'Low';

            document.getElementById('avgStudy').textContent = avgStudy + 'h';
            document.getElementById('avgSleep').textContent = avgSleep + 'h';
            document.getElementById('latestRisk').textContent = latestRisk;
        }

        document.getElementById('habitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Syncing... 🚀';
            btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const data = {
                student_id: user.student_id,
                study_hours: parseFloat(document.getElementById('studyHours').value),
                sleep_hours: parseFloat(document.getElementById('sleepHours').value),
                attendance_percentage: parseFloat(document.getElementById('attendance').value),
                social_media_hours: parseFloat(document.getElementById('socialMedia').value),
                exercise_frequency: parseInt(document.getElementById('exercise').value),
                stress_level: parseInt(document.getElementById('stress').value),
                mental_health_rating: parseInt(document.getElementById('mentalHealth').value),
                motivation_level: parseInt(document.getElementById('motivation').value),
                time_management_score: 7, financial_stress: 0, screen_time_hours: 3, previous_gpa: 3.0,
                exam_score: 75, assignment_completion_rate: 90
            };

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert('Habits recorded successfully!');
                    loadHistory();
                    showTab('history');
                } else {
                    alert('Error recording habits: ' + (result.message || 'Unknown error'));
                }
            } catch (e) {
                alert('Submission failed! Please check connection.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        function getCleanDisplayName(user) {
            let name = user.full_name;
            if (!name || name.includes('@')) {
                let raw = user.full_name || user.username || user.email || 'Student';
                if (raw.includes('@')) {
                    raw = raw.split('@')[0];
                }
                name = raw.replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim();
            }
            return name || 'Student';
        }

        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!user.student_id && !user.user_id) window.location.href = '/login';
            const name = getCleanDisplayName(user);
            document.getElementById('userName').textContent = name;
            const initial = (name[0] || 'S').toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
            const mobileAvatar = document.getElementById('mobileUserAvatar');
            if (mobileAvatar) mobileAvatar.textContent = initial;
            loadHistory();
        };

        function logout() { localStorage.clear(); window.location.href = '/login'; }
    </script>
</body>

</html>
