<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-navbutton-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <title>Sign Up - StudyTrack</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: clamp(1rem, 4vw, 2rem);
            background: #f8fafc;
        }

        .signup-card {
            width: 100%;
            max-width: 480px;
            padding: clamp(1.75rem, 5vw, 2.5rem);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .password-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 500px) {
            .password-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .message {
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            display: none;
            font-weight: 600;
        }

        .message.success {
            background: var(--success-light);
            color: var(--success-dark);
            border: 1px solid var(--success);
        }

        .message.error {
            background: var(--danger-light);
            color: var(--danger-dark);
            border: 1px solid var(--danger);
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div class="signup-header">
            <a href="/" style="text-decoration: none; display: inline-block; margin-bottom: 0.85rem;">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="StudyTrack AI" style="height: 48px; width: auto; max-width: 220px; object-fit: contain;">
            </a>
            <h1 class="gradient-text" style="font-size: 1.85rem; margin-bottom: 0.4rem;">Create Account</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Join the future of student success</p>
        </div>

        <div id="message" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input class="form-control" type="text" id="fullName" name="fullName" required
                    placeholder="Enter your full name" autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" required
                    placeholder="Choose a username" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" name="email" required
                    placeholder="your.email@example.com" autocomplete="email">
            </div>

            <div class="password-grid">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required
                        placeholder="Password" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required
                        placeholder="Confirm" autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-signup" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
                Start Your Journey 🚀
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; color: var(--text-muted); font-size: 0.9rem;">
            Already have an account?
            <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 700;">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long!', 'error');
                return;
            }

            const btn = document.querySelector('.btn-signup');
            btn.textContent = 'Creating Account...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('Account created successfully! Redirecting...', 'success');

                    localStorage.setItem('user', JSON.stringify({
                        user_id: data.user_id,
                        student_id: data.student_id,
                        username: data.username,
                        full_name: data.full_name || fullName,
                        email: email,
                        role: data.role
                    }));

                    setTimeout(() => {
                        window.location.href = '/student';
                    }, 100);
                } else {
                    showMessage(data.message, 'error');
                    btn.textContent = 'Start Your Journey 🚀';
                    btn.disabled = false;
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred. Please try again.', 'error');
                btn.textContent = 'Start Your Journey 🚀';
                btn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + type;
            msgDiv.style.display = 'block';
        }
    </script>
</body>

</html>
